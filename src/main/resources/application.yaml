server:
  port: 8090

spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/demo-api
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      password: MyVerySecurePassword
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # configuration cache type
  cache:
    type: redis
config:
  security:
    secret: ${JWT_SECRET}
    expiration: 900000 # 15 mins
    refresh-token-expiration: 1 # h
  json-placeholder:
    base-url: https://jsonplaceholder.typicode.com
    uri:
      posts: /posts
      comments: /comments
  telegram:
    base-url: https://api.telegram.org/bot{TOKEN}/sendMessage
    token: 8203338306:AAHjBlmpzNg53d4k4rAOXAPbrD0fPg_-MpA
    chat-id: 895853342
  login:
    max-attempts: 5
    lock-duration: 1m